name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        # Dashboard render tests import React and TanStack Query from web/.
        # Keep the root install frozen; web dependencies have a separate manifest.
        run: |
          (cd web && bun install)
          bun test --timeout 30000

      - name: Enforce critical-path coverage
        run: bun run test:critical:coverage

      - name: Verify CLI boots
        run: bun src/index.ts --version

      - name: Smoke-test install.sh into a throwaway prefix
        shell: bash
        run: |
          PREFIX="$(mktemp -d)"
          # Stub authmux so install.sh's Step 5 doesn't run `npm install -g`.
          printf '#!/usr/bin/env bash\necho 0.0.0\n' > "$PREFIX/authmux"
          chmod +x "$PREFIX/authmux"
          # CUE_SHIMS is where the agent shims land; without it they go to
          # ~/.config/cue/shims and the assertions below test an empty prefix.
          SHIM_DIR="$PREFIX" CUE_SHIMS="$PREFIX" CUE_DIR="$GITHUB_WORKSPACE" PATH="$PREFIX:$PATH" bash ./install.sh --yes
          test -L "$PREFIX/cue" -o -f "$PREFIX/cue"
          grep -Eq 'exec .*bin/cue" launch claude' "$PREFIX/claude"
          PATH="$PREFIX:$PATH" "$PREFIX/cue" --version

      - name: Verify bundled CLI boots
        run: bun run build:bundle && node dist/cue.js --version

      - name: Validate all profiles
        run: bun src/index.ts validate --all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit --skipLibCheck

      - name: Lint (biome)
        run: bun run lint

      # Ratchet the inherited/vendor skill backlog: existing debt is tolerated,
      # but a PR cannot increase the error count. Lower MAX_ERRORS as cleanup lands.
      - name: Lint skills
        run: bun run lint:skills:baseline

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install

      - name: Type check web
        run: bun x tsc --noEmit -p web/tsconfig.json
